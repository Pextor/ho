<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>원하는 사이트 검색</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px;
      margin: 3px;
      border: none;
      background-color: #eee;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    #results a {
      display: block;
      color: blue;
      text-decoration: underline;
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <h1>원하는 사이트 검색</h1>
  <p><em>Welcome to Erebus!</em></p>

  <input type="text" id="searchInput" placeholder="단어를 입력하세요..." onkeyup="search()">

  <div id="alphabet"></div>
  <div id="results"></div>

  <script>
    const sites = [
      "Alejandra Iko Chuv", "Best Gore Fun", "Block Site Opener", "CIVI", "Carro groce",
      "countryside", "Daily Best", "DuckDuckGo", "Dcinside", "El Blog del Narco", "FaceBook",
      "FunkyTown", "Gleb Korablev", "Google", "Horse", "Instagram", "Jaguar", "Knife M",
      "Living Mexico", "LiveGore", "Monkey", "Naver", "Onion Site Opener"
    ];

    function displaySites(list) {
      const resultDiv = document.getElementById("results");
      resultDiv.innerHTML = "";
      list.forEach(site => {
        const a = document.createElement("a");
        a.href = "#";
        a.textContent = site;
        resultDiv.appendChild(a);
      });
    }

    function search() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const filtered = sites.filter(site => site.toLowerCase().includes(input));
      displaySites(filtered);
    }

    function setupAlphabetButtons() {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const alphaDiv = document.getElementById("alphabet");

      for (let ch of alphabet) {
        const btn = document.createElement("button");
        btn.textContent = ch;
        btn.onclick = () => {
          const filtered = sites.filter(site => site[0].toUpperCase() === ch);
          displaySites(filtered);
        };
        alphaDiv.appendChild(btn);
      }
    }

    // 초기 실행
    setupAlphabetButtons();
    displaySites(sites);
  </script>

</body>
</html>
