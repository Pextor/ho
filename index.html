<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 폐쇄 공지</title>
    <style>
        body {
            background-color: #f4f4f4;
            color: #333;
            font-family: "Noto Sans KR", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5em;
            color: #d32f2f;
            text-align: center;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            text-align: center;
        }
        .notice {
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9em;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>국제 공조 수사에 따른 사이트 폐쇄</h1>
        <p>
            본 사이트는 <strong>국제형사경찰기구(INTERPOL)</strong> 및<br>
            <strong>국내 수사기관</strong>의 공조 수사 결과<br>
            관련 법률 위반 사항이 확인되어 폐쇄되었습니다.
        </p>
        <p class="notice">
            해당 사건과 관련하여 궁금한 점이 있으신 분은<br>
            관할 수사기관에 문의하시기 바랍니다.
        </p>
        <footer>
            ⓒ 2025 INTERPOL & 국내 수사기관. All Rights Reserved.
        </footer>
    </div>
</body>
</html>
